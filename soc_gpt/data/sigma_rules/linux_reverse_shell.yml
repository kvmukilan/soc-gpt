title: Linux Reverse Shell via Netcat or Bash
id: a1b2c3d4-0002-0002-0002-000000000002
status: stable
description: Detects reverse shell patterns using netcat, bash TCP redirection, or similar tools
author: SOC-GPT Demo
date: 2024/01/01
tags:
  - attack.execution
  - attack.T1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    cmdline|contains:
      - '/dev/tcp/'
      - 'nc -e'
      - 'ncat -e'
      - 'bash -i'
      - 'mkfifo'
  condition: selection
level: critical
falsepositives:
  - Penetration testing
  - Legitimate debugging
