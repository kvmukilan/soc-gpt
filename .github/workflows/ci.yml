name: Production readiness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify the installed wheel outside the source checkout
        run: |
          cd "${{ runner.temp }}"
          python -c 'from importlib.resources import files; from soc_gpt.sigma_ingestor import load_rules_from_dir; assert len(load_rules_from_dir(files("soc_gpt").joinpath("data/sigma_rules"))) == 4'

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the console container starts as a regular user
        run: |
          set -euo pipefail
          docker build -t soc-gpt:ci .
          docker run -d --name soc-gpt-ci -p 127.0.0.1:8501:8501 soc-gpt:ci
          trap 'docker logs soc-gpt-ci; docker rm -f soc-gpt-ci' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:8501/_stcore/health
          test "$(docker exec soc-gpt-ci id -u)" = 10001
