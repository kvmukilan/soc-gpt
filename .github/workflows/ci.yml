name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used anywhere in this workflow; restrict the token to read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (with dev tools)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (with dev tools)
        run: pip install -e ".[dev]"
      # The suite is fully offline: no Elasticsearch, Ollama, network or secrets.
      - name: Run offline test suite
        run: pytest
